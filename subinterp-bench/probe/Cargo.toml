# 独立 workspace —— 不参与 pyo3 自己的 workspace,这样它可以自由选择依赖哪个版本。
# 默认编译的是 crates.io 上的【上游】0.29;要编 fork 版,在命令行加:
#   cargo build --release --config 'patch.crates-io.pyo3.path="../.."'
[workspace]

[package]
name = "abi3t"
version = "0.0.0"
edition = "2021"

[lib]
name = "abi3t"
crate-type = ["cdylib"]

[features]
# 子模块走 wrap_pymodule! —— 父提交在那条路上会拒绝子解释器,于是它一开就把
# 所有基准的对照列一起废掉。默认关,只有 submodule.py 打开它。
submodule = []

# 限定 API 构建。polars 用的就是这个,而它逼出了三个只在这条路上才出现的 bug:
# 两个 FFI 函数不在限定 API 里、slot 因编译期 cfg 只到 3.10 而发不出、
# 占位符泄漏到子模块。基准里【一个 abi3 构建都没有】,所以一个都没抓到。
abi3 = ["pyo3/abi3-py310"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = 3
