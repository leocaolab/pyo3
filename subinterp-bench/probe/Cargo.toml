# 独立 workspace —— 不参与 pyo3 自己的 workspace,这样它可以自由选择依赖哪个版本。
# 默认编译的是 crates.io 上的【上游】0.29;要编 fork 版,在命令行加:
#   cargo build --release --config 'patch.crates-io.pyo3.path="../.."'
[workspace]

[package]
name = "abi3t"
version = "0.0.0"
edition = "2021"

[lib]
name = "abi3t"
crate-type = ["cdylib"]

[features]
# 子模块走 wrap_pymodule! —— 父提交在那条路上会拒绝子解释器,于是它一开就把
# 所有基准的对照列一起废掉。默认关,只有 submodule.py 打开它。
submodule = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
opt-level = 3
